name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    container: curlimages/curl

    steps:
      - name: Ping Supabase
        run: |
          curl --fail \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE }}" \
            "https://fhefiqxqmqfaiicgcgqf.supabase.co/rest/v1/health_check?select=id&limit=1"
