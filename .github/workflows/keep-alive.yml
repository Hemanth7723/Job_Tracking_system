name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    container: curlimages/curl
    steps:
      - name: Ping Supabase health
        run: |
          curl -f https://fhefiqxqmqfaiicgcgqf.supabase.co/rest/v1/health_check?select=id&limit=1 \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
